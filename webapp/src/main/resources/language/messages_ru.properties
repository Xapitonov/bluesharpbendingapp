impressum.content=<h2> Реквизиты </h2> <p> Ответственный за сайт: </p> <address> Christian Kierdorf<br/> Gringsstrasse 25<br/> 53177 Bonn<br/> Германия<br/> <span class="rtl">ed.bewilhcs@frodreik.naitsirhc</span> </address> <p>Yassine Chakri создал дизайн сайта и перевёл политику конфиденциальности Android-приложения на английский. Большое ему спасибо ;-)</p> <p>Логотип сайта основан на работе paulgillings76 с pixabay.com.</p> <p>Тексты на сайте частично созданы с помощью языковой модели Vicuna.</p> <p>Для перевода текстов использовался DeepL.</p> <p>Прозрачность: проект разрабатывается с помощью искусственного интеллекта с конца 2024 года.</p>
datenschutz.content=<h2>Политика конфиденциальности этого сайта</h2> \
<p>Это политика конфиденциальности сайта <em>letsbend.de</em>.</p> \
<p>Цель сайта — помогать игрокам на гармонике попадать в правильные ноты. На подстранице есть веб-версия приложения Let's Bend, использующая микрофон для анализа звуков и частот.</p> \
<p>Ответственный за защиту данных сайта:</p> \
<address>Christian Kierdorf<br/>Gringsstrasse 25<br/>53177 Bonn<br/>Германия<br/><span class="rtl">ed.bewilhcs@frodreik.naitsirhc</span></address> \
<p>Для безопасности работы сайта ведётся журнал доступа с параметрами:</p> \
<ul> \
<li>Тип и версия браузера,</li> \
<li>Операционная система,</li> \
<li>Дата и время доступа,</li> \
<li>Данные запроса и адрес,</li> \
<li>Имя файла и размер,</li> \
<li>Статус успешности запроса (код HTTP).</li> \
</ul> \
<p>IP-адрес пользователя не хранится. Журнал удаляется максимум через 24 часа. Данные не передаются третьим лицам и не используются иначе.</p> \
<h3>Cookies</h3> \
<p>При заходе на сайт устанавливается технический сессионный cookie (JSESSIONID) для идентификации пользователя в сессии. Cookie не содержит личных данных и удаляется при закрытии браузера.</p> \
<p>Правовая основа — ст. 6 п.1 лит. f GDPR (законный интерес в функционировании сайта).</p> \
<p>Сайт размещён на серверах Host Europe, обработка данных там регулируется их политикой конфиденциальности.</p> \
<h3>Веб-версия приложения и доступ к микрофону</h3> \
<p>Веб-версия Let's Bend запрашивает доступ к микрофону устройства для анализа частот. Обработка звука происходит только локально в браузере, данные звука не передаются и не сохраняются.</p> \
<p><strong>Детали обработки:</strong></p> \
<ul> \
<li>Микрофон передаёт аудиопоток со звуками гармоники и окружающей среды.</li> \
<li>Обработка идёт локально.</li> \
<li>Данные удаляются после анализа.</li> \
</ul> \
<p>Вы можете в любой момент отозвать доступ к микрофону через настройки браузера.</p> \
<h3>Отсутствие передачи данных третьим лицам</h3> \
<p>Данные не передаются сторонним организациям.</p> \
<h3>Безопасность обработки</h3> \
<p>Ресурс использует SSL/TLS шифрование для защиты данных.</p> \
<h3>Права субъектов данных</h3> \
<p>В соответствии с GDPR у вас есть право на:</p> \
<ul> \
<li><strong>Доступ (ст.15):</strong> узнавать, обрабатываются ли ваши данные.</li> \
<li><strong>Исправление (ст.16):</strong> требовать исправления неточных данных.</li> \
<li><strong>Удаление (ст.17):</strong> требовать удаления данных, если нет юридических оснований для хранения.</li> \
<li><strong>Ограничение обработки (ст.18):</strong> требовать ограничения обработки.</li> \
<li><strong>Возражение (ст.21):</strong> отказаться от обработки на законных основаниях.</li> \
<li><strong>Жалоба:</strong> обращаться в надзорные органы по защите данных.</li> \
</ul> \
<h3>Компетентный орган по защите данных:</h3> \
<p>Уполномоченный по защите данных и свободе информации Северного Рейна-Вестфалии</p> \
<p>Сайт: <a href="https://www.ldi.nrw.de">www.ldi.nrw.de</a></p> \
