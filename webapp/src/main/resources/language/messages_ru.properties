android.PrivacyPolicy=<h2> Политика конфиденциальности Android-приложения</h2> \
<p>Это политика конфиденциальности для Android-версии <em>Let's Bend</em> (BluesHarpBendingApp), опубликованной в Google Play Store и Amazon Appstore. Цель приложения — помочь гармонистам точно попадать в ноты.</p> \
<p><em>Let's Bend</em> разработано как хобби-проект: </p> \
<address>Christian Kierdorf<br/>Gringsstrasse 25<br/>53177 Bonn<br/>Германия</address> \
<p>Вопросы по политике можно направлять разработчику: <span class="rtl">ed.bewilhcs@frodreik.naitsirhc</span></p> \
<p>Приложение не содержит рекламы и не требует регистрации. Для работы нужен доступ к микрофону устройства. При использовании, кроме звуков гармоники, могут попадать аудио личного характера, которые приложение обрабатывает как звуки гармоники без отдельного анализа.</p> \
<p>Звуки захватываются как поток через стандартную библиотеку <a href="https://developer.android.com/reference/android/media/MediaRecorder">MediaRecorder</a>, преобразуются в музыкальные ноты математическими методами и отображаются. Поток не сохраняется на устройстве и не передается третьим лицам.</p> \
<p>Доступ к микрофону можно в любое время отозвать в настройках устройства.</p> \
<p>Других персональных данных приложение не обрабатывает.</p> \
<p>При установке из Google Play и Amazon может собираться дополнительная информация, на что разработчик не влияет. Подробнее в политике конфиденциальности <a href="https://policies.google.com/privacy?hl=en">Google Play</a> и <a href="https://developer.amazon.com/docs/policy-center/privacy-security.html">Amazon Appstore</a>.</p> \
<p>Дата создания политики: 9 июня 2023, опубликовано <a href="https://www.letsbend.de/datenschutz.html#privacy_policy_android">здесь.</a> Немецкая версия доступна <a href="https://www.letsbend.de/datenschutz.html#datenschutz_android">здесь</a>.</p>
