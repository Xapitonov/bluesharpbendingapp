index.content=<h2> Let's Bend — Научитесь играть на губной гармонике и бендить как мастер </h2> <p> Для новичков <em>бенд</em> (придание нотам характерного изгиба) на губной гармонике — большой вызов. Это требует много времени и регулярных тренировок. Посредством бендинга даже полутоновые звуки можно извлекать с помощью специальных техник выдувания и втягивания, что невозможно при обычной игре по отверстиям. Новички часто спрашивают: «Это бенд или точно сыгран полутон?» </p> <p> Легкое и эффективное приложение <em>Let's Bend</em> делает освоение искусства бендинга доступным и увлекательным. Благодаря визуализации звучащих нот, вы быстро начнете бендить как профессионал. </p> <p> Короткое видео о функционале доступно здесь:</p> \
<video controls width="100%"><source src="/videos/android_3.4.0.mp4" type="video/mp4">Ваш браузер не поддерживает видео.</video> \
<p> Изначальная идея создания <em>Let's Bend</em> — сделать приложение, работающее на всех популярных ОС с удобной масштабируемостью окна. Часто при тренировках хочется использовать другие приложения или разные устройства. Также нужно было поддержать все тональности и распространённые специальные настройки губных гармоник.</p> \ \
<p> В итоге есть две версии приложения: для ПК (macOS, Debian, Windows) и для мобильных устройств Android.</p> <p> Версия для Android выпущена бесплатно и без рекламы в <a href="https://play.google.com/store/apps/details?id=de.schliweb.bluesharpbendingapp&hl=en">Google Play</a>, <a href="https://www.amazon.de/Christian-Kierdorf-Lets-Bend/dp/B0C96X2KRG">Amazon</a> и <a href="https://f-droid.org/de/packages/de.schliweb.bluesharpbendingapp/">F-Droid</a>.</p> <p> Из-за дополнительных затрат на публикацию в Microsoft Store и Apple App Store, версия для ПК там не размещена. Вместо этого <a href="/download.html">здесь доступен альтернативный способ загрузки версии для ПК.</a> </p> \
<p> Для предварительного знакомства доступна <a href="/letsbend.html">веб-версия</a>.</p> <p>Для подробных инструкций смотрите <a href="/doc.html">Руководство пользователя</a>.</p> \
<p> Исходный код приложений опубликован <a href="https://github.com/egdels/bluesharpbendingapp">здесь.</a> </p><p> Если хотите поддержать разработчика <em>Let's Bend</em> добровольным пожертвованием, в версии для ПК есть функция <em>Купить мне кофе</em>. Но даже в этом случае <em>Let's Bend</em> остается бесплатным.</p> <p> Достаточно слов. <em>Пора бендить!</em></p>
doc.content=<h2>Руководство пользователя</h2> \
<h3>Версия для Android</h3> \
<h4>Основное окно губной гармоники</h4> \
<p>Главное окно Android-приложения отображает губную гармонику с её отверстиями и нотами. Когда вы играете ноту, соответствующая нота подсвечивается на экране.</p> \
<p><img src="/images/docs/android_harp_view.png" alt="Просмотр губной гармоники на Android" class="screenshot" /></p> \
<p>Пример: При игре ноты C на отверстии 4 (выдувание) приложение выделит её. Если вы бендите ноту, приложение покажет цветной индикатор, насколько близко вы к целевой ноте.</p> \
<h4>Увеличенное отображение ноты</h4> \
<p>При игре ноты и нажатии на неё вверху экрана появляется увеличенный вид ноты с более подробной обратной связью.</p> \
<p><img src="/images/docs/android_harp_view_enlarged.png" alt="Увеличенный просмотр губной гармоники на Android" class="screenshot" /></p> \
<p>Увеличенное окно показывает:</p> \
<ul> \
  <li><strong>Название ноты:</strong> крупным жирным шрифтом для удобства чтения.</li> \
  <li><strong>Значение в центах:</strong> насколько ваш тон отличается от целевой ноты (в центах, 100 центов = полутон).</li> \
  <li><strong>Визуальный индикатор:</strong> горизонтальная линия двигается вверх или вниз в зависимости от тона. По центру — точное попадание. Если линия выше — звук острый, если ниже — тон плоский.</li> \
  <li><strong>Цветовая обратная связь:</strong> линия меняет цвет от зелёного (близко к цели) до красного (далеко от цели).</li> \
</ul> \
<p>Это особенно полезно при тренировке бендинга, давая моментальное визуальное подтверждение точности.</p> \
<h4>Окно тренировки</h4> \
<p>В режиме тренировки можно упражняться с определёнными нотами или гаммами, выбирать тип тренировки и уровень точности.</p> \
<p><img src="/images/docs/android_training_view.png" alt="Окно тренировки на Android" class="screenshot" /></p> \
<p>Пример: Выберите "Тренировка бендинга" и точность "Средняя". Приложение приведёт вас через серию нот и покажет прогресс.</p> \
<h4>Настройка точности</h4> \
<p>Точность определяет, насколько близко нужно сыграть ноту, чтобы приложение перешло к следующей. Измеряется в центах (100 центов = полутон).</p> \
<ul> \
  <li><strong>Низкие значения (5-15):</strong> требуют высокой точности — играть очень близко к цели.</li> \
  <li><strong>Средние (20-30):</strong> сбалансированный уровень для большинства игроков.</li> \
  <li><strong>Высокие (35-45):</strong> более снисходительны, подходят для новичков и сложных техник.</li> \
</ul> \
<p>Совет: начинайте с высокой точности и постепенно снижайте её, улучшая навыки.</p> \
<h4>Настройки</h4> \
<p>В окне настроек можно изменить параметры приложения под себя.</p> \
<p><img src="/images/docs/android_settings_view.png" alt="Окно настроек Android" class="screenshot" /></p> \
<p>Пример: чтобы сменить тональность гармоники, выберите "C" в списке. Для смены стройки выберите "Рихтер".</p> \
<h4>Понимание тональности и строя</h4> \
<p>Эти настройки важны для правильного распознавания гармоники:</p> \
<ul> \
  <li><strong>Тональность:</strong> Основной тон гармоники. Большинство начинающих берут гармонику в тональности C, но есть варианты A, Bb, D, F, G и др. Тональность обычно указана на гармонике. Верный выбор гарантирует правильное отображение нот.</li> \
  <li><strong>Строй:</strong> Определяет расположение нот по отверстиям. Самый распространённый — "Рихтер" (Richter), чаще всего для блюзовых гармоник. Есть и другие: "Соло", "Пэдди Рихтер", "Мелоди Мейкер" и др., оптимизированные под различные стили. Правильный строй обеспечивает точность отображения нот.</li> \
</ul> \
<p>Если не уверены в тональности или строе, посмотрите упаковку или надписи на гармонике.</p> \
<h4>Настройка уверенности</h4> \
<p>Определяет, насколько приложение должно быть уверено в распознавании ноты:</p> \
<ul> \
  <li><strong>Высокие значения (0.8-0.95):</strong> более точное распознавание, но менее отзывчивое.</li> \
  <li><strong>Средние (0.5-0.75):</strong> баланс точности и отзывчивости.</li> \
  <li><strong>Низкие (0.05-0.45):</strong> более отзывчиво, но может ошибаться в шумной среде.</li> \
</ul> \
<p>Совет: в тихой среде выбирайте высокие значения для точности; в шумной — низкие для быстрой реакции.</p> \
<h3>Версия для ПК</h3> \
<h4>Основное окно гармоники</h4> \
<p>Версия для ПК показывает гармонику крупнее, удобнее видеть ноты и индикаторы бендинга.</p> \
<p><img src="/images/docs/desktop_harp_view.png" alt="Просмотр гармоники на ПК" class="screenshot" /></p> \
<p>Пример: в десктопной версии окно можно менять по размеру, удобно использовать одновременно с другими программами во время тренировки.</p> \
<h4>Увеличенный просмотр ноты</h4> \
<p>Как и в Android, при клике на ноту появляется увеличенное окно в центре экрана с детальной обратной связью. Клик в любой части увеличенного просмотра закрывает его.</p> \
<h4>Окно тренировки</h4> \
<p>Функционал тренировки совпадает с Android, но адаптирован под большие экраны.</p> \
<p><img src="/images/docs/desktop_training_view.png" alt="Окно тренировки на ПК" class="screenshot" /></p> \
<p>Возможно, в десктопной версии есть дополнительные режимы тренировки и визуализации.</p> \
<h3>Веб-версия</h3> \
<p>Веб-версия позволяет практиковаться прямо в браузере без установки.</p> \
<p><img src="/images/docs/web_app_view.png" alt="Веб-приложение" class="screenshot" /></p> \
<p>Пример: выберите тональность и строй гармоники, нажмите «Старт». Разрешите браузеру доступ к микрофону.</p> \
<h3>Алгоритмы распознавания тона</h3> \
<p>Let's Bend использует продвинутые алгоритмы распознавания нот. В версиях для ПК и Android доступны три алгоритма: YIN, MPM и HYBRID, в веб-версии — YIN и MPM. В приложении или во время разработки проверялись следующие:</p> \
<h4>Алгоритм YIN</h4> \
<p>Надёжный метод, базирующийся на автокорреляции аудиосигнала.</p> \
<p><strong>Плюсы:</strong></p> \
<ul> \
  <li>Стабильное и надёжное распознавание</li> \
  <li>Подходит новичкам из-за меньшей чувствительности к вариациям игры</li> \
  <li>Хорошо работает с разными типами гармоник</li> \
</ul> \
<p><strong>Минусы:</strong></p> \
<ul> \
  <li>Медленнее обрабатывает (≈297 мс)</li> \
  <li>Чуть меньше точность (среднее отклонение 0.97 центов)</li> \
  <li>Больше расходует батарею на мобильных устройствах</li> \
</ul> \
<h4>Алгоритм MPM (McLeod Pitch Method)</h4> \
<p>Современный метод, использующий нормализованную функцию разности квадратов.</p> \
<p><strong>Плюсы:</strong></p> \
<ul> \
  <li>Гораздо быстрее (≈7.59 мс, в 39 раз быстрее YIN)</li> \
  <li>Более высокая точность (0.03 цента)</li> \
  <li>Энергоэффективнее на мобильных устройствах</li> \
</ul> \
<p><strong>Минусы:</strong></p> \
<ul> \
  <li>Чувствительнее к вариациям техники игры</li> \
  <li>Иногда менее стабильные результаты с некоторыми гармониками</li> \
</ul> \
<p><strong>Рекомендация:</strong> новичкам начать с YIN, более опытным — переключаться на MPM для скорости и точности.</p> \
<h4>Алгоритм HYBRID</h4> \
<p>Комбинирует YIN для низких частот, MPM для средних и FFT для высоких.</p> \
<p><strong>Плюсы:</strong></p> \
<ul> \
  <li>Лучшая общая точность по всему диапазону гармоники</li> \
  <li>Хорошая производительность за счёт параллельной обработки</li> \
  <li>Надёжное распознавание в разных условиях</li> \
  <li>Устойчива к фоновому шуму</li> \
</ul> \
<p><strong>Минусы:</strong></p> \
<ul> \
  <li>Сложнее реализовать</li> \
  <li>Требует больше ресурсов на старых/слабых устройствах</li> \
</ul> \
<h3>Советы для новичков</h3> \
<ul> \
  <li>Начинайте с одиночных нот: учитесь играть чисто.</li> \
  <li>Используйте визуальную обратную связь приложения.</li> \
  <li>Тренируйтесь регулярно, бендинг требует времени.</li> \
  <li>Экспериментируйте с положением языка и формы рта.</li> \
  <li>Используйте режим тренировки для структурированного прогресса.</li> \
</ul> \
<h3>Экспериментальное распознавание аккордов</h3> \
<p>Функция способна распознавать игру сразу нескольких нот (аккорды).</p> \
<p><strong>Включение распознавания аккордов:</strong></p> \
<ul> \
  <li>В настройках отметьте «Показывать аккорды».</li> \
  <li>Приложение попытается выделять аккорды при игре нескольких нот.</li> \
</ul> \
<p><strong>Принцип работы:</strong></p> \
<ul> \
  <li>Используется спектральный анализ нескольких частот.</li> \
  <li>При обнаружении аккорда все ноты подсвечиваются.</li> \
  <li>Поддерживаются аккорды из 2, 3 и 4 нот.</li> \
  <li>Аккорды могут быть соседними отверстиями или с закрытием средних отверстий.</li> \
</ul> \
<p><strong>Ограничения:</strong></p> \
<ul> \
  <li>Экспериментальная функция, возможны ошибки распознавания.</li> \
  <li>Фоновый шум ухудшает качество распознавания.</li> \
  <li>Разные гармоники и техники игры по-разному подходят.</li> \
  <li>Максимум 4 одновременные ноты распознаются.</li> \
</ul> \
<p><strong>Советы для использования:</strong></p> \
<ul> \
  <li>Играйте в тихом помещении.</li> \
  <li>Начинайте с простых 2-нотных аккордов.</li> \
  <li>Экспериментируйте с техникой игры.</li> \
  <li>Если распознавание нестабильное, попробуйте поднять настройки уверенности.</li> \
</ul>
